<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#385e59"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" style="font: bold 20px Microsoft YaHei, sans-serif;fill:#153d39">音乐版本变化概览</text><rect x="60" y="60" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="86" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">初始版本 V1</text><text x="80" y="108" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">创建时生成音频并建立创作记录</text><line x1="540" y1="126" x2="540" y2="158" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="160" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="186" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">修改</text><text x="80" y="208" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">基于最新蓝图与修改要求生成下一版本</text><line x1="540" y1="226" x2="540" y2="258" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="260" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="286" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">版本历史</text><text x="80" y="308" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">保存旧版本记录及关联音频</text><line x1="540" y1="326" x2="540" y2="358" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="360" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="386" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">选择</text><text x="80" y="408" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">切换当前播放版本；不重新生成花朵</text><line x1="540" y1="426" x2="540" y2="458" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="460" width="960" height="