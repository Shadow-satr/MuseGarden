<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#385e59"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" style="font: bold 20px Microsoft YaHei, sans-serif;fill:#153d39">创作交互顺序</text><rect x="60" y="60" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="86" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">用户 / 前端</text><text x="80" y="108" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">选择空地，输入文字</text><line x1="540" y1="126" x2="540" y2="158" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="160" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="186" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">HTTP API</text><text x="80" y="208" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">POST /api/creations；验证请求模型</text><line x1="540" y1="226" x2="540" y2="258" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="260" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="286" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">CreationService</text><text x="80" y="308" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">检查花园与种植位置，构造蓝图</text><line x1="540" y1="326" x2="540" y2="358" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="360" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="386" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">MusicGenerationService</text><text x="80" y="408" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">调用 ACE-Step 并保存音频</text><line x1="540" y1="426" x2="540" y2="458" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="460" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="486" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">存储与花园</text><text x="80" y="508" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">保存记忆、最终创作、花朵、种植和创作关联</text><line x1="540" y1="526" x2="540" y2="558" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="560" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="586" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">前端</text><text x="80" y="608" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">接收结果，刷新花园并提供播放</text></svg>