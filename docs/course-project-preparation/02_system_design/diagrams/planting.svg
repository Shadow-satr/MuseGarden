<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#385e59"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="28" y="35" style="font: bold 20px Microsoft YaHei, sans-serif;fill:#153d39">种植规则流程</text><rect x="60" y="60" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="86" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">检查中心</text><text x="80" y="108" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">非 SOIL 或中心被占用：抛出错误</text><line x1="540" y1="126" x2="540" y2="158" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="160" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="186" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">判断大花</text><text x="80" y="208" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">prefer_large 且所有 3×3 格位于同一田地并未占用</text><line x1="540" y1="226" x2="540" y2="258" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="260" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="286" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">选择占地</text><text x="80" y="308" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">满足条件用大花，否则使用 1×1 小花</text><line x1="540" y1="326" x2="540" y2="358" stroke="#385e59" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="360" width="960" height="65" rx="9" fill="#eef7f4" stroke="#54867c" stroke-width="2"/><text x="80" y="386" style="font:bold 16px Microsoft YaHei,sans-serif;fill:#153d39">返回计划</text><text x="80" y="408" style="font:14px Microsoft YaHei,sans-serif;fill:#354e4a">返回中心、尺寸、占地和田地标识</text></svg>